<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stoonmone</title>
  <meta name="theme-color" content="#13151f">
  <meta name="description" content="Prototyp einer Begleit-App: Kompendium, Filter und Troupe-Liste mit Platzhalterdaten.">

  <!-- Damit die App auf dem iPhone wie eine echte App aussieht (Home-Bildschirm) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Stoonmone">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <h1>
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M21 3a13 13 0 1 0 8 22A11 11 0 0 1 21 3z" fill="currentColor"/>
      </svg>
      Stoonmone
    </h1>
    <p class="sub">Prototyp mit Platzhalterdaten</p>
  </header>

  <main>
    <!-- ===== Ansicht 1: Kompendium ===== -->
    <section id="view-compendium" aria-label="Kompendium">
      <p id="data-note" class="note" hidden></p>

      <div class="filters">
        <label class="sr-only" for="search">Suche</label>
        <input id="search" type="search" placeholder="Name, Keyword oder Regeltext suchen" autocomplete="off">

        <label class="sr-only" for="faction">Fraktion</label>
        <select id="faction"></select>

        <details class="keyword-box" id="keyword-box">
  <summary id="keyword-summary">Keywords</summary>
  <div id="chips" class="chips" role="group" aria-label="Keywords"></div>
</details>

        <div class="filter-meta">
          <span id="count" aria-live="polite"></span>
          <button id="reset" class="link" type="button">Filter zurücksetzen</button>
        </div>
      </div>

      <div id="cards" class="cards"></div>
    </section>

    <!-- ===== Ansicht 2: Troupes ===== -->
<section id="view-troupe" aria-label="Troupes" hidden>
  <div class="troupe-shell">
    <aside class="troupe-list" id="troupe-list" aria-label="Saved troupes">
      <!-- Buttons for each troupe will be injected here -->
    </aside>

    <div class="troupe-panel">
      <label for="troupe-name">Name of the troupe</label>
      <input id="troupe-name" type="text" maxlength="40" autocomplete="off">

      <div class="slots" id="slots" aria-hidden="true"></div>
      <p id="troupe-count" class="count-line"></p>

      <ol id="members" class="members"></ol>
      <p id="troupe-empty" class="empty" hidden>
        No members yet. Switch to the Compendium and select a troupe to add characters.
      </p>

      <div class="troupe-actions">
        <button id="clear" class="ghost" type="button">Clear troupe</button>
        <button id="duplicate-troupe" class="ghost" type="button">Duplicate</button>
        <button id="delete-troupe" class="ghost danger" type="button">Delete</button>
      </div>

      <details class="share">
        <summary>Share / backup</summary>

        <label for="export-code">Troupe code</label>
        <textarea id="export-code" rows="3" readonly></textarea>
        <button id="copy" type="button">Copy code</button>

        <label for="import-code">Paste code</label>
        <textarea id="import-code" rows="3" placeholder="Paste code here"></textarea>
        <button id="import" type="button">Import troupe</button>
      </details>
    </div>
  </div>
</section>

<!-- floating new-troupe button -->
<button id="new-troupe" class="floating-plus" aria-label="New Troupe" title="New Troupe">+</button>

  <!-- Untere Leiste zum Wechseln der Ansichten -->
  <nav class="tabs" role="tablist" aria-label="Bereiche">
    <button role="tab" id="tab-compendium" data-tab="compendium" aria-selected="true" type="button">Kompendium</button>
    <button role="tab" id="tab-troupe" data-tab="troupe" aria-selected="false" type="button">
      Troupe <span id="badge" class="badge">0/8</span>
    </button>
  </nav>

  <!-- Detailansicht eines Charakters -->
  <dialog id="detail" aria-label="Charakterdetails">
    <div id="detail-body"></div>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
